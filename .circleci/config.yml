version: 2.1
# This CircleCI config.yml file uses PINNED dependencies as required by
# OpenSSF Scorecard. Every "image:" below is written as
#     repository:tag@sha256:digest
# and BOTH halves matter. The digest is what actually gets pulled, and
# is what makes the pin a pin. The tag is not decoration and not a
# comment: it is the only part a tool can read to know what the digest
# is *of*, and so what a newer version would even mean.
#
# Do not move the tag into a trailing "# pin :tag" comment, which is how
# this file used to read. Renovate's circleci manager hands each image
# string to its Dockerfile parser, which splits on "@" and then on ":".
# With no tag in the reference itself it records no current version, and
# a dependency with a digest and no tag is resolved against "latest" --
# so a comment-only tag would have quietly produced PostgreSQL major
# version upgrades. See docs/build-environment-staleness.md.
#
# Writing both also makes the pair self-checking: Docker verifies the
# digest against the tag, so a tag and digest that drift apart fail
# ("manifest verification failed") instead of silently disagreeing.
#
# To find the digest for a tag:
# > docker manifest inspect cimg/postgres:16.4
# Tags are listed at https://hub.docker.com/r/cimg/postgres/tags and
# https://circleci.com/developer/images/image/cimg/postgres
#
# We now use NO orbs at all, and if one is ever added it must be
# CircleCI-certified (the "circleci/*" namespace). The previous
# codecov/codecov and naokikimura/dscar-brakeman orbs are uncertified
# public orbs: loading them would require enabling the org-wide "Allow
# uncertified public orbs" setting, which lets ANY community orb run in
# ANY pipeline across the org -- a supply-chain risk we decline to
# accept. Instead, Codecov upload is run natively below (pinned +
# hash-verified CLI), and Brakeman now runs as a GitHub Actions check
# gating the main branch (see .github/workflows/brakeman.yml). Because
# staging and production are only ever advanced from main, gating main
# is sufficient for this static analyzer. The last orb,
# circleci/browser-tools, went when Chrome moved into its own container.

# Cache version is AUTOMATICALLY managed via checksums:
# - {{ checksum ".ruby-version" }} invalidates cache when Ruby version changes
# - {{ checksum "Gemfile.lock" }} invalidates cache when gems change
# - This eliminates the need for manual cache version bumping
# - No manual intervention needed when upgrading Ruby or Bundler

# Reusable executors - define Docker images once, use them multiple times
executors:
  ruby-postgres:
    docker:
      # Primary image - Ruby with browsers for testing
      # When updating Ruby: update the tag and SHA256 here, and see the
      # cache note above (cache versions manage themselves).
      - image: drdavidawheeler/cii-bestpractices:3.4.1-browsers@sha256:97770a22ec2c88bf9fa028cc136446129f33e15df62bb4c0dc65f2c25d22ffe7
        environment:
          PG_HOST: localhost
          PG_USER: ubuntu
          RAILS_ENV: test
          RACK_ENV: test
          # Drive Chrome in the selenium container below rather than a
          # Chrome installed beside the tests. Secondary containers share
          # this container's network, which is the same fact that lets
          # PG_HOST be "localhost". See docs/testing.md for the other
          # ways to run system tests, and
          # docs/build-environment-staleness.md for why.
          SELENIUM_REMOTE_URL: http://127.0.0.1:4444
          # On a system test failure Rails photographs the browser by
          # itself; this also saves the page's HTML beside the image.
          # Headless does not mean blind: the screenshot is a full render,
          # fonts and images and all. But for a selector or layout failure
          # the DOM usually says more than the picture, and it is the DOM
          # *after* JavaScript, which the server response cannot show you.
          # Both land in tmp/capybara, which is already an artifact path
          # below, so this costs one variable and no plumbing. Rails
          # requires exactly "1".
          RAILS_SYSTEM_TESTING_SCREENSHOT_HTML: '1'
      # Secondary image - PostgreSQL for database
      - image: cimg/postgres:16.4@sha256:2e4f1a965bdd9ba77aa6a0a7b93968c07576ba2a8a7cf86d5eb7b31483db1378
        environment:
          POSTGRES_USER: ubuntu
          POSTGRES_DB: circle_ruby_test
      # Secondary image - Chrome, for system tests.
      #
      # The tag names the Chrome version, and chromedriver inside the
      # image is matched to it by construction, so the pair can never
      # drift the way a separately-installed driver can. Because this is
      # an image pinned in this file, Renovate proposes Chrome upgrades
      # as ordinary pull requests, with no mechanism of our own.
      #
      # One session at a time is enough: system tests run serially, see
      # the "test:optimized" comment in lib/tasks/default.rake.
      #
      # The image ships a whole desktop so that a person can watch a test
      # over VNC: Xvfb, x11vnc, fluxbox, and noVNC. Headless Chrome needs
      # none of it, and every container in this job shares one memory
      # budget, so turn it off. Measured, not guessed: idle memory falls
      # from 233MB to 174MB and the peak during the system tests from
      # 816MB to 719MB, with the suite passing identically (23 tests, 199
      # assertions).
      #
      # Do NOT also set SE_JAVA_OPTS to cap the heap. -Xmx256m looks
      # harmless, saves nothing measurable (the JVM's resident size is
      # about 145MB either way, and its default maximum is a fraction of
      # container memory, so it is already self-limiting), and produced
      # 18 errors of Net::ReadTimeout across the suite. Tested.
      #
      # To watch a test in a browser instead, run your own container
      # without these two variables; see docs/testing.md.
      - image: selenium/standalone-chrome:150.0.7871.124@sha256:9569014786466376d3e5cf8a7758562368cd9637f783dcd3abdb2eaf3a0d5cd7
        environment:
          SE_START_XVFB: "false"
          SE_START_VNC: "false"

  image-builder:
    docker:
      # prepare-image needs an HTTPS client and the Docker CLI, and
      # nothing else: it does not run Ruby, Node or any of our code.
      - image: cimg/base:2026.03@sha256:fdfacc6ce19a878cdacd7af20adf2b7a6dd0c0965b453c73844409bfbe882377

  deploy-only:
    docker:
      # The deploy job needs git, node, npm, wget, and openssl, and
      # nothing else. It runs no Ruby at all: validate_branch_name is a
      # /bin/sh script, and the database migration runs on the Heroku
      # dyno via "heroku run", not here.
      #
      # So it does *not* share the test image. That image carries Chrome,
      # chromedriver, a full Ruby toolchain, and Google's apt repository,
      # none of which deploy uses. This is also the one job holding
      # HEROKU_API_KEY, the one that can push to production, so carrying
      # less code here is worth having a second image.
      #
      # Node 24 is the current LTS. The Heroku CLI we install below
      # requires node >=20.
      - image: cimg/node:24.19.0@sha256:8966565f07189a67d64d6808a2b127f31dafae566508e3547f55640e1070bfad

jobs:
  # Build the test image, but only when it does not already exist.
  #
  # NOT YET WIRED IN. The build job below still uses the old DockerHub
  # image; pointing it at what this job publishes is a separate change,
  # so that a failure here cannot be confused with a failure there.
  # See docs/build-environment-staleness.md, "The plan", steps 3 and 4.
  #
  # Why a separate job at all: a CircleCI job cannot run inside an image
  # it just built, because the executor's image is resolved from static
  # configuration before any step runs.
  prepare-image:
    executor: image-builder
    environment:
      # Public, so the build job needs no pull credential at all and the
      # only secret anywhere is this job's push token. Under the ossf
      # organisation rather than a personal account, which was the real
      # complaint about the image this replaces.
      IMAGE_REPO: ghcr.io/ossf/badgeapp-test
      # "docker manifest" is still gated behind this on some CLI
      # versions, and silently absent without it.
      DOCKER_CLI_EXPERIMENTAL: enabled
    steps:
      - checkout
      - setup_remote_docker
      - run:
          name: Work out what the image should be
          command: |
            set -euo pipefail
            RUBY_VERSION="$(tr -d '[:space:]' < .ruby-version)"
            NODE_VERSION="$(sed -n 's/.*"node": *"\([^"]*\)".*/\1/p' \
                            package.json | head -1)"
            test -n "$RUBY_VERSION" && test -n "$NODE_VERSION"

            # Resolve what heroku/heroku:24-build points at *now*, so the
            # build is pinned to an exact digest and records which one.
            # The policy is "pin whatever was current at build time and
            # record it", not "freeze a digest until someone edits it".
            TOKEN="$(curl -sf --retry 5 --retry-delay 5 --retry-all-errors \
              "https://auth.docker.io/token?service=registry.docker.io&scope=repository:heroku/heroku:pull" \
              | sed -n 's/.*"token":"\([^"]*\)".*/\1/p')"
            BASE_DIGEST="$(curl -sfI --retry 5 --retry-delay 5 --retry-all-errors \
              -H "Authorization: Bearer $TOKEN" \
              -H 'Accept: application/vnd.oci.image.index.v1+json' \
              -H 'Accept: application/vnd.docker.distribution.manifest.list.v2+json' \
              "https://registry-1.docker.io/v2/heroku/heroku/manifests/24-build" \
              | tr -d '\r' | sed -n 's/^[Dd]ocker-[Cc]ontent-[Dd]igest: //p')"
            test -n "$BASE_DIGEST"

            # The cache key needs BOTH halves. The base digest alone
            # keeps us current with nobody deciding anything, because
            # when Heroku rebuilds the stack image the key changes by
            # itself, but it cannot notice that *we* changed the recipe.
            # The recipe hash alone would cache too well, because an
            # operating system security update changes nothing we wrote.
            RECIPE_HASH="$(cat dockerfiles/badgeapp-test/Dockerfile \
                               .ruby-version package.json \
                           | sha256sum | cut -c1-12)"
            TAG="heroku24-ruby${RUBY_VERSION}-node${NODE_VERSION}"
            TAG="${TAG}-b$(echo "$BASE_DIGEST" | cut -c8-19)-r${RECIPE_HASH}"

            echo "export RUBY_VERSION='$RUBY_VERSION'" >> "$BASH_ENV"
            echo "export NODE_VERSION='$NODE_VERSION'" >> "$BASH_ENV"
            echo "export BASE_DIGEST='$BASE_DIGEST'"   >> "$BASH_ENV"
            echo "export TAG='$TAG'"                   >> "$BASH_ENV"
            echo "Base:  heroku/heroku:24-build@$BASE_DIGEST"
            echo "Image: $IMAGE_REPO:$TAG"
      - run:
          name: Log in to the registry
          command: |
            set -euo pipefail
            echo "$GHCR_TOKEN" | docker login ghcr.io \
              -u "$GHCR_USER" --password-stdin
      - run:
          name: Point "current" at that image, building it if it is new
          command: |
            set -euo pipefail
            # Ask whether the tag exists. Note this runs BEFORE any
            # decision to build, so the common path is two registry
            # reads and one registry write, and no build at all.
            if docker manifest inspect "$IMAGE_REPO:$TAG" >/dev/null 2>&1
            then
              echo "Cache hit: $TAG already exists, not rebuilding."
            else
              echo "Cache miss: building $TAG."
              docker build \
                --build-arg BASE_IMAGE="heroku/heroku:24-build@${BASE_DIGEST}" \
                --build-arg RUBY_VERSION="$RUBY_VERSION" \
                --build-arg NODE_VERSION="$NODE_VERSION" \
                -t "$IMAGE_REPO:$TAG" \
                -f dockerfiles/badgeapp-test/Dockerfile \
                dockerfiles/badgeapp-test
              docker push "$IMAGE_REPO:$TAG"
            fi

            # Repoint "current" on BOTH paths, which is the whole point.
            # An earlier design halted before this on a cache hit, which
            # left "current" wherever the last cache *miss* had put it.
            # That is silently wrong as soon as two Ruby versions are in
            # flight, which is exactly what a Ruby upgrade proposal
            # produces: two branches would alternate cache hits, neither
            # repointing, and each would run its tests on the other's
            # interpreter without saying so.
            #
            # imagetools copies registry-side, so this does not pull the
            # image just to retag it.
            docker buildx imagetools create \
              -t "$IMAGE_REPO:current" "$IMAGE_REPO:$TAG"
            echo "current -> $TAG"

  build:
    executor: ruby-postgres
    working_directory: ~/ossf/best-practices-badge
    parallelism: 1
    resource_class: medium
    shell: /bin/bash --login
    environment:
      CIRCLE_ARTIFACTS: /tmp/circleci-artifacts
      CIRCLE_TEST_REPORTS: /tmp/circleci-test-results
    steps:
    - checkout
    # Refresh apt package lists before any apt-based installs.
    # Ubuntu mirrors occasionally return 404 for stale package versions
    # that have been replaced by a newer release; apt-get update fetches
    # current metadata so subsequent installs find the right URLs.
    #
    # DISABLED 2026-08-04. Nothing in this job uses apt, so all this did
    # was print an error on every build. It could not verify Google's
    # Chrome apt repository: our test image's base
    # (cimg/ruby:3.4.1-browsers) was built 2025-01-06, and Google created
    # the signing subkey FD533C07C264648F, which signs that repository
    # today, on 2025-01-07. Pinning an image by digest freezes its copy
    # of the keyring too, so that key can never arrive; apt then reports
    # "NO_PUBKEY FD533C07C264648F". Rebuilding the image would fix it
    # only until Google rotates the subkey again, which they do about
    # once a year.
    #
    # We checked before disabling this, not just assumed: there is no
    # "apt-get install" anywhere in this file; browser-tools/install-
    # chromedriver fetches chromedriver with curl and only apt-installs
    # on yum-based systems; and nothing "rake default" runs uses apt.
    #
    # Restore it if a step is ever added that installs a package with
    # apt. If you do, restrict it to Ubuntu's own repositories:
    #     sudo apt-get update -o Dir::Etc::sourceparts=/dev/null
    # which ignores /etc/apt/sources.list.d, so a third-party repository
    # we never install from cannot make the step fail.
    # - run:
    #     name: Update apt package lists
    #     command: sudo apt-get update
    # The browser-tools orb used to install chromedriver here. It is gone
    # because Chrome now runs in its own container, which carries a
    # chromedriver matched to it. The orb was in any case redundant:
    # selenium-webdriver 4.6+ resolves a driver by itself, which is why
    # a developer machine with no chromedriver on PATH still works.
    #
    # CircleCI starts secondary containers but does not wait for what is
    # inside them to be ready, and the grid takes a few seconds. Without
    # this, the first system test can race the browser's startup.
    - run:
        name: Wait for the Chrome container
        command: |
          for i in $(seq 1 60); do
            if curl -sf --max-time 3 http://127.0.0.1:4444/status |
                 grep -q '"ready": *true'; then
              echo "Selenium grid ready after ${i}s"
              curl -sf --max-time 3 http://127.0.0.1:4444/status |
                grep -o '"browserVersion": *"[^"]*"' | head -1
              exit 0
            fi
            sleep 1
          done
          echo 'ERROR: Selenium grid never became ready'
          exit 1
    # Implement OSPS-BR-01.02: Validate branch name before use in pipeline
    # Protect against malicious branch names that could cause cache poisoning
    # or command injection attacks. Branch names are used in cache keys below.
    - run:
        name: Validate branch name
        command: script/validate_branch_name "$CIRCLE_BRANCH"
    - run: pwd
    - run: ls -l
    # Chrome is deliberately not listed: the Chrome that matters is the
    # one in the selenium container, and the wait step above prints its
    # version. Any Chrome in this image is not the one under test.
    #
    # The memory and CPU lines answer a real question rather than
    # decorating the log. "resource_class: medium" is shared by every
    # container in this job, and adding the selenium container (Java plus
    # Chrome) made that budget tighter without anyone measuring it. Read
    # these numbers before changing resource_class, in either direction.
    # The cgroup path is the method CircleCI's own documentation
    # recommends; v2 replaced memory.stat's hierarchical_memory_limit
    # with memory.max, so try both and print whichever exists.
    # Java is not listed either, and that is the point: nothing we build
    # or test uses a JVM. The only Java that matters is Selenium Grid's,
    # inside its own image. When the new test image is built it should
    # not install a JDK at all.
    - run: |
        ruby --version
        node --version
        echo "CPUs visible: $(nproc)"
        if [ -r /sys/fs/cgroup/memory.max ]; then
          echo "memory limit (cgroup v2): $(cat /sys/fs/cgroup/memory.max)"
        elif [ -r /sys/fs/cgroup/memory/memory.stat ]; then
          grep hierarchical_memory_limit /sys/fs/cgroup/memory/memory.stat
        else
          echo 'memory limit: could not read a cgroup limit'
        fi
        free -m 2>/dev/null || true
    # Prepare for artifact and test results
    - run: mkdir -p $CIRCLE_ARTIFACTS $CIRCLE_TEST_REPORTS
    # Force cleanup to make deterministic.
    # See https://circleci.com/docs/2.0/caching
    # - run: bundle clean --force
    # Dependencies
    # Restore the dependency cache
    - restore_cache:
        keys:
        # Automatic cache versioning - no manual updates needed!
        # Ruby version change = new cache, Gemfile.lock change = new cache
        - dep-{{ checksum ".ruby-version" }}-{{ checksum "Gemfile.lock" }}-{{ arch }}-{{ .Branch }}
    # This would show what we restored
    # - run: find ~/.rubygems || true
    - run:
        name: Update bundler to match Gemfile.lock
        command: >
          sudo sh -c 'yes | gem install bundler --no-document
          -v "$(cat Gemfile.lock | tail -1 | tr -d \\\\" \\\\")"'
    - run:
        name: Bundler Version
        command: bundle --version
    - run:
        name: Install Bundle
        # Note: --path=vendor/bundle removed, we don't need it.
        command: >
          bundle check ||
          bundle install --jobs=4 --retry=3
    # Here's how we could show more:
    # - run: find ~/.rubygems || true
    # - run: find ~/.bundle || true
    # - run: find ~ -name "*rack-timeout*" || true
    # Save dependency cache
    - save_cache:
        # Automatic cache versioning - matches restore_cache above
        key: dep-{{ checksum ".ruby-version" }}-{{ checksum "Gemfile.lock" }}-{{ arch }}-{{ .Branch }}
        # Bundler's git cache is often stored in ~/.bundle or vendor/bundle;
        # we need to cache them for git-based downloads so we don't need
        # recompile every time
        paths:
          - ~/.rubygems
          - ~/.bundle
          - vendor/bundle
          - ~/.bundle
    - run:
        name: Configure database
        command: |
          cd config/
          cp {database.ci,database}.yml
    - run:
        name: Create database
        command: bundle exec rake db:setup
    # Start testing
    - run:
        name: Check for whitespace issues.
        command: '[[ ! -s "$(git rev-parse --git-dir)/shallow" ]] || git fetch --unshallow'
    - run:
        name: Run comprehensive checks and tests (rake default)
        command: CI=true bundle exec rake
    # Save test results
    - store_test_results:
        path: /tmp/circleci-test-results
    # Save artifacts
    - store_artifacts:
        path: /tmp/circleci-artifacts
    - store_artifacts:
        path: coverage
    - store_artifacts:
        path: license_finder_report.html
    - store_artifacts:
        path: log/test.log
    - store_artifacts:
        path: tmp/capybara
    - store_artifacts:
        path: test/html_reports
    - store_artifacts:
        path: /tmp/circleci-test-results
    # Upload coverage to Codecov using the official Codecov CLI, pinned to a
    # specific version and verified against a hardcoded SHA-256 hash before
    # use. This matches the dependency-pinning policy stated at the top of this
    # file and mirrors the Heroku CLI install in the deploy job: we never run
    # an unpinned, unverified binary fetched over the network. The coverage
    # JSON itself is produced by SimpleCov::Formatter::JSONFormatter in the
    # test:coverage_gaps rake task. --disable-search + --file restrict the upload to
    # exactly that file, and --plugin noop skips Codecov's coverage-generation
    # plugins (we already have the report). We do NOT pass --fail-on-error, so
    # a Codecov outage cannot break an otherwise-green build. The upload token,
    # if any, is read from the CODECOV_TOKEN project environment variable.
    #
    # To upgrade: choose a release from
    #   https://github.com/codecov/codecov-cli/releases
    # then record its hash (the value before "  codecov") from
    #   https://cli.codecov.io/<version>/linux/codecov.SHA256SUM
    - run:
        name: Upload coverage to Codecov (pinned, hash-verified CLI)
        command: |
          CODECOV_CLI_VERSION="v11.2.8"
          CODECOV_EXPECTED_SHA256="8930c4bb30254a42f3d8c340706b1be340885e20c0df5160a24efa2e030e662b"
          echo "** Downloading Codecov CLI ${CODECOV_CLI_VERSION}"
          curl -fsS -o codecov \
            "https://cli.codecov.io/${CODECOV_CLI_VERSION}/linux/codecov"
          echo "** Verifying SHA-256 hash of downloaded CLI"
          ACTUAL_SHA256="$(sha256sum codecov | cut -d' ' -f1)"
          if [ "$ACTUAL_SHA256" != "$CODECOV_EXPECTED_SHA256" ]; then
            echo "ERROR: Codecov CLI hash mismatch - possible supply chain attack"
            echo "  Expected: $CODECOV_EXPECTED_SHA256"
            echo "  Actual:   $ACTUAL_SHA256"
            rm -f codecov
            exit 1
          fi
          echo "** Hash verified. Uploading coverage."
          chmod +x codecov
          ./codecov upload-process --disable-search --plugin noop \
            --file coverage/coverage.json
          rm -f codecov

  # I haven't found a reliable way to calculate HEROKU_APP just once,
  # so it gets recalculated. This approach still greatly reduces
  # duplication.
  deploy:
    executor: deploy-only
    steps:
      - checkout
      # OSPS-BR-01.02: Validate branch name before use in deployment
      # Defense in depth - even though workflow filters limit to staging/production,
      # the code should validate explicitly to prevent accidents or misconfigurations
      - run:
          name: Validate branch name format
          command: script/validate_branch_name "$CIRCLE_BRANCH"
      - run:
          name: Validate deployment branch allowlist
          command: |
            # Deploy job should ONLY run on staging or production branches
            # Using POSIX-compliant case statement
            case "$CIRCLE_BRANCH" in
              staging|production)
                echo "Deployment branch validated: $CIRCLE_BRANCH"
                ;;
              *)
                echo "ERROR: Deploy job on invalid branch: $CIRCLE_BRANCH"
                echo "Deploy is only allowed for: staging, production"
                exit 1
                ;;
            esac
      - run:
          # Install the Heroku CLI at a pinned version with an independently
          # hardcoded SHA-512 hash for integrity verification.
          #
          # We download the tarball directly from the npm registry, verify
          # its SHA-512 against the hash we recorded when we set this pin,
          # and only install if the hash matches.  This protects against:
          #   - MITM attacks on the download
          #   - A compromised npm registry that changes both the package
          #     *and* the hash it reports (which a simple `npm install`
          #     would not catch, since it trusts the registry's own hash)
          #
          # To upgrade the Heroku CLI:
          #   1. Find the new version at https://github.com/heroku/cli/releases
          #   2. Get its integrity hash:
          #      npm view heroku@NEW_VERSION dist.integrity
          #   3. Update HEROKU_VERSION and HEROKU_INTEGRITY below.
          #
          # These tools are only used to *transfer* the final build artifact
          # to Heroku; they are not part of the deployed application.
          # See: https://devcenter.heroku.com/articles/heroku-cli
          name: Install Heroku CLI tools (to easily control maintenance mode)
          command: |
            echo "** Node version:"
            node -v
            echo "** npm version:"
            npm -v
            # Heroku CLI 10.x declared "engines: node 20.x", which would
            # have tied this job to a Node release that is now end of
            # life. 11.x declares ">=20", so we can track the current
            # Node LTS instead. The commands we use here (git:remote,
            # maintenance:on/off, run) are unchanged across that bump.
            HEROKU_VERSION="11.8.1"
            HEROKU_TARBALL_URL="https://registry.npmjs.org/heroku/-/heroku-${HEROKU_VERSION}.tgz"
            # SHA-512 integrity hash in SRI format, recorded from the npm registry.
            # Obtain via: npm view heroku@${HEROKU_VERSION} dist.integrity
            HEROKU_INTEGRITY="sha512-FgNpd1CvHXrHDQnr59aK7DNY+1UbtX2QFPTMfEBODAk64WtlLX/d+yrbYowSoDfXxxN2zUCzAzgQdGKBEanrxg=="
            # Strip the "sha512-" prefix to get the raw base64-encoded hash.
            HEROKU_EXPECTED_HASH="${HEROKU_INTEGRITY#sha512-}"
            echo "** Downloading Heroku CLI ${HEROKU_VERSION}"
            wget -q "$HEROKU_TARBALL_URL" -O heroku.tgz
            echo "** Verifying SHA-512 hash of downloaded tarball"
            ACTUAL_HASH=$(openssl dgst -sha512 -binary heroku.tgz | openssl base64 -A)
            if [ "$ACTUAL_HASH" != "$HEROKU_EXPECTED_HASH" ]; then
              echo "ERROR: Heroku CLI tarball hash mismatch - possible supply chain attack"
              echo "  Expected: $HEROKU_EXPECTED_HASH"
              echo "  Actual:   $ACTUAL_HASH"
              rm -f heroku.tgz
              exit 1
            fi
            echo "** Hash verified. Installing Heroku CLI."
            npm install -g --prefix ~/heroku-cli ./heroku.tgz
            export PATH="$HOME/heroku-cli/bin:$PATH"
            echo 'export PATH="$HOME/heroku-cli/bin:$PATH"' >> "$BASH_ENV"
            rm -f heroku.tgz
            echo "** Heroku CLI version:"
            heroku --version
      - run:
          name: Deploy to Heroku
          command: |
            export HEROKU_APP="$CIRCLE_BRANCH"-bestpractices
            # Set file .netrc so "git push heroku ..." will work later.
            # Heroku uses HEROKU_API_KEY, but git only knows about ~/.netrc.
            # https://devcenter.heroku.com/articles/authentication
            echo 'Set up .netrc so git push will work'
            printf 'machine git.heroku.com\n  login %s\n  password %s\n' \
              'bestpractices@linuxfoundation.org' "$HEROKU_API_KEY" > ~/.netrc
            echo "Set git remote heroku for $HEROKU_APP"
            heroku git:remote -a "$HEROKU_APP"
            git remote get-url heroku
            echo "Switching to maintenance mode in $HEROKU_APP"
            heroku maintenance:on --app "$HEROKU_APP"
            # Give production site a few seconds to complete ongoing work.
            [ "$HEROKU_APP" != 'production-bestpractices' ] || sleep 10
            echo "Deploying to $HEROKU_APP"
            # Switching from "master" here requires additional work, see:
            # https://stackoverflow.com/questions/10451330/clean-git-repo-on-heroku
            # https://stackoverflow.com/questions/36111040/error-message-after-successfully-pushing-to-heroku
            GIT_CURL_VERBOSE=1 GIT_TRACE=1 git push heroku "$CIRCLE_BRANCH:master"
      # - run:
      #       # This may no longer be necessary
      #       name: Setup Heroku
      #       command: bash .circleci/setup-heroku.sh
      - run:
          name: Migrate DB
          command: |
            export HEROKU_APP="$CIRCLE_BRANCH"-bestpractices
            heroku run --app "$HEROKU_APP" -- bundle exec rails db:migrate
            if [ -f '.recalculate' ] ; then
                echo 'Recalculation marker found, performing recalculation.'
                heroku run --app "$HEROKU_APP" -- rake update_all_badge_percentages
                rm -f '.recalculate'
            fi
            heroku maintenance:off --app "$HEROKU_APP"
          no_output_timeout: 20m
      # Not reliable enough:
      # - run:
          # name: Test Fastly
          # command: script/fastly_test
workflows:
  version: 2
  build-deploy:
    jobs:
      - build
      - deploy:
          context: bestpractices-heroku-deploy
          requires:
            - build
          filters:
            branches:
              only:
                - staging
                - production
