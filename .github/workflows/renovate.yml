---
name: Renovate

# Run Renovate ourselves, on a schedule, rather than installing the hosted
# GitHub App. Updating our own CI configuration is no reason to give a
# third party write access to this repository. See
# docs/build-environment-staleness.md for the due diligence.
#
# What it proposes is scoped by .github/renovate.json5 to the images
# pinned in .circleci/config.yml, which is the one ecosystem Dependabot
# cannot read.

# Limit permissions per OpenSSF Scorecard best practices.
# Since we set "permissions", anything unset has access "none".
#
# Renovate does NOT use this token. It authenticates with a short-lived
# token minted from our own GitHub App; see the mint step for why.
permissions:
  contents: read

on:
  schedule:
    # Weekly, early Monday UTC. Minute chosen off the hour because
    # GitHub delays schedules that pile up on the hour.
    - cron: '17 4 * * 1'
  # So a human can ask for a run without waiting a week.
  workflow_dispatch:

jobs:
  renovate:
    name: Propose CircleCI image updates
    runs-on: ubuntu-latest

    steps:
      # Use harden-runner https://github.com/step-security/harden-runner
      # presented at OpenSSF Best Practices WG 2022-03-15
      - uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout
        # Pin to commit SHA to prevent supply chain attacks via tag mutation.
        # Verify: curl -s https://api.github.com/repos/actions/checkout/git/ref/tags/v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # OSPS-BR-01.02: Validate branch name before use in pipeline
      # GITHUB_REF_NAME is the short ref name (e.g., "main" not "refs/heads/main")
      - name: Validate branch name
        run: script/validate_branch_name "$GITHUB_REF_NAME"

      - name: Require the App credentials
        # Fail with a sentence rather than letting the mint step fail with
        # a library message about a missing input.
        env:
          RENOVATE_APP_ID: ${{ secrets.RENOVATE_APP_ID }}
          RENOVATE_APP_PRIVATE_KEY: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}
        run: |
          if [ -z "$RENOVATE_APP_ID" ] ||
             [ -z "$RENOVATE_APP_PRIVATE_KEY" ]; then
            echo 'ERROR: RENOVATE_APP_ID and RENOVATE_APP_PRIVATE_KEY'
            echo 'must both be set as REPOSITORY secrets. They come from'
            echo 'the openssf-badge-renovate GitHub App, which only an'
            echo 'ossf organization owner can create. See'
            echo 'docs/build-environment-staleness.md.'
            exit 1
          fi
          echo 'App credentials are set.'

      # WHY MINT RATHER THAN STORE. Renovate must not authenticate as the
      # default GITHUB_TOKEN: GitHub raises no workflow runs for events
      # created by it, so a Renovate pull request opened with it would
      # start NONE of brakeman, codeql, codespell or main, and would be
      # checked LESS than a pull request from a stranger. CircleCI is
      # unaffected either way, triggering from its own integration.
      #
      # The credential is therefore our own GitHub App. A GitHub App
      # INSTALLATION TOKEN EXPIRES ONE HOUR after it is issued, so it
      # cannot be a stored secret; what is stored is the App id and
      # private key, and the token is minted here on each run. That is
      # also why a personal access token was rejected: it belongs to a
      # person and expires on their clock, not the project's.
      #
      # WHAT THE APP GRANTS, on this repository only, and why each one:
      #   contents: write, pull-requests: write   a pull request is a
      #     branch plus a commit, and GitHub files both under contents;
      #     there is no narrower permission for it.
      #   issues: write                           the dependency
      #     dashboard is an issue, and so are Renovate's config-error
      #     reports. Without it a broken renovate.json5 produces a green
      #     run that did nothing, which is the failure this whole
      #     workflow is arranged to avoid.
      #   checks: read, statuses: read            so it can see whether
      #     CI passed on a pull request it already opened, and leave it
      #     alone or refresh it accordingly.
      #
      # Never "workflows: write": scoped to the circleci manager,
      # Renovate has no business under .github/workflows, and
      # withholding it means it cannot alter our GitHub Actions. Branch
      # protection on main, staging and production means it cannot merge
      # or deploy regardless.
      #
      # The minted token is revoked in this action's post step, so it is
      # dead when the job ends rather than an hour later.
      - name: Mint a short-lived token from the App
        id: app_token
        # Pin to commit SHA to prevent supply chain attacks via tag mutation.
        # Verify: curl -s https://api.github.com/repos/actions/create-github-app-token/git/ref/tags/v3.2.0
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.RENOVATE_APP_ID }}
          private-key: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}
          # Omitting "owner" and "repositories" scopes the token to the
          # repository this workflow runs in, which is what we want and
          # is one less name to keep in step with reality.
          #
          # NAMING THE PERMISSIONS HERE IS THE PREFLIGHT CHECK, and it
          # does two jobs at once.
          #
          # It fails loudly. GitHub rejects a request for a permission
          # the installation does not hold, so if any of these are ever
          # missing this step stops the run instead of letting Renovate
          # start and half work. That case is otherwise invisible: the
          # step before proves only that the two secrets EXIST, and a
          # Renovate that cannot open its dashboard issue still opens
          # pull requests and still exits zero. A green run that quietly
          # dropped half its job is the thing this workflow is arranged
          # to never do.
          #
          # It also scopes the token down. Without these the token
          # carries everything the installation has, now and whatever it
          # is granted later; with them it carries these five and
          # nothing else, whatever the App accumulates.
          #
          # So this list must equal what Renovate actually needs. Adding
          # a Renovate feature that needs more means granting it on the
          # App AND naming it here.
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write
          permission-checks: read
          permission-statuses: read

      - name: Explain a refused mint
        # Only when the mint itself failed, so this does not comment on
        # some later failure it knows nothing about.
        if: failure() && steps.app_token.outcome == 'failure'
        run: |
          echo 'The App could not issue a token with the permissions'
          echo 'this workflow asked for. Usually that means'
          echo 'openssf-badge-renovate is missing one of them, which'
          echo 'only an ossf organization owner can add, in two steps:'
          echo 'edit the App permissions, THEN approve the change on the'
          echo 'installation, which does not happen automatically.'
          echo 'Needed: contents write, pull-requests write, issues'
          echo 'write, checks read, statuses read. See the comment on'
          echo 'the mint step and docs/build-environment-staleness.md.'

      - name: Renovate
        # Pin to commit SHA to prevent supply chain attacks via tag mutation.
        # Verify: curl -s https://api.github.com/repos/renovatebot/github-action/git/ref/tags/v46.2.1
        uses: renovatebot/github-action@316d7cd859606d6039a2182b7d69199e9b036835 # v46.2.1
        with:
          # Deliberately no "configurationFile". That input sets
          # Renovate's GLOBAL config, which is a different layer: it
          # configures the runner, not this repository's update rules.
          # Pointing it at .github/renovate.json5 makes Renovate read our
          # repository config as global config, which is the wrong thing
          # even where it appears to work. Renovate finds
          # .github/renovate.json5 by itself, that being one of the
          # standard repository config locations. The distinction is
          # visible in renovate-config-validator, which reports
          # "Validating ... as global config" when handed the path
          # explicitly, and just "Validating ..." when it discovers it.
          token: ${{ steps.app_token.outputs.token }}
        env:
          # Only this repository, whatever the token can otherwise reach.
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          LOG_LEVEL: info

          # WHO THE COMMITS COME FROM, stated rather than detected.
          # Renovate normally learns this by asking GitHub who the token
          # belongs to, which it cannot do here: an App installation
          # token has no user behind it, and /user answers "Resource not
          # accessible by integration". Recent Renovate can work the
          # identity out for App tokens, but the failure mode if it
          # cannot is an unclear error at startup, and saying it outright
          # costs two lines and removes the question.
          #
          # The address format is GitHub's own for a bot account: the
          # numeric user id, a plus sign, the login, at the noreply
          # domain. Get anything wrong and GitHub shows the commits as
          # authored by nobody in particular, rather than failing, so
          # this is worth checking against reality rather than eyeballing.
          # Verify: curl -s 'https://api.github.com/users/openssf-badge-renovate%5Bbot%5D'
          RENOVATE_USERNAME: 'openssf-badge-renovate[bot]'
          RENOVATE_GIT_AUTHOR: >-
            openssf-badge-renovate[bot]
            <313971568+openssf-badge-renovate[bot]@users.noreply.github.com>
